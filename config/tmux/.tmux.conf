# =============================================================================
#  ~/.tmux.conf  ——  tmux 配置文件
#  目标：状态栏样式与 ~/.p10k.zsh (Powerlevel10k) 视觉风格保持一致
#  适用 tmux 版本：3.2+
# =============================================================================

# ─── 基础行为 ────────────────────────────────────────────────────────────────

# 启用鼠标支持：可点击切换 pane / window，可滚轮滚动历史
set -g mouse on

# 启用 OSC 52 剪贴板转义：让 tmux 把复制内容发送给外层终端（iTerm2 等）
# 注意选项名是 set-clipboard，不是 clipboard；可选值 on / off / external
set -g set-clipboard on

# 默认终端类型：tmux-256color 提供更完整的 terminfo（光标形状、斜体等）
set -g default-terminal "tmux-256color"

# 为支持 truecolor 的外层终端（iTerm2 / Alacritty / WezTerm 等）启用 24-bit 色
set -ga terminal-overrides ",*256col*:Tc"

# 历史回滚行数：每个 pane 保留 10000 行输出
set -g history-limit 10000

# 窗口编号从 1 开始（默认 0），与键盘数字键顺序更一致
set -g base-index 1

# pane 编号也从 1 开始
set -g pane-base-index 1

# 关闭某个窗口后自动重新编号，避免出现 1 3 4 这种空洞
set -g renumber-windows on

# 转义字符延迟：设为 0 让 vim 等程序的 ESC 键响应更迅速
set -sg escape-time 0


# ─── 分屏快捷键 ──────────────────────────────────────────────────────────────

# 解绑默认的水平分屏键 "
unbind '"'
# prefix + -  ：上下分屏（垂直方向再开一个 pane）
bind - split-window -v

# 解绑默认的垂直分屏键 %
unbind %
# prefix + |  ：左右分屏（更直观的"管道"符号）
bind | split-window -h


# ─── 配置重载 ────────────────────────────────────────────────────────────────

# prefix + r  ：重新加载本配置文件，并在状态栏显示提示
bind r source-file ~/.tmux.conf \; display-message "✔ tmux.conf reloaded"


# ─── macOS 剪贴板兼容 ────────────────────────────────────────────────────────

# 若系统中安装了 reattach-to-user-namespace（解决旧版 macOS 下 pbcopy/pbpaste
# 在 tmux 内失效的问题），则用它包装默认 shell；新系统通常已不需要
if-shell 'command -v reattach-to-user-namespace >/dev/null 2>&1' \
  'set-option -g default-command "reattach-to-user-namespace -l $SHELL"'


# =============================================================================
#  状态栏（Status Line）—— 与 ~/.p10k.zsh 颜色映射保持一致
#
#  左侧 →  [apple]  [dir]  [ branch]  [+staged]  [!unstaged]  [?untracked]
#  右侧 →  [ node]  [ conda env]  [ HH:MM:SS]
#
#  颜色对照（均取自 POWERLEVEL9K_*_FOREGROUND）：
#    colour240 → POWERLEVEL9K_BACKGROUND                    （状态栏底色）
#    colour39  → POWERLEVEL9K_DIR_ANCHOR_FOREGROUND         （目录 / 当前窗口）
#    colour76  → POWERLEVEL9K_VCS_CLEAN_FOREGROUND          （干净的 git 分支）
#    colour178 → POWERLEVEL9K_VCS_MODIFIED_FOREGROUND       （已 stage / 已修改）
#    colour39  → POWERLEVEL9K_VCS_UNTRACKED_FOREGROUND      （未跟踪文件）
#    colour70  → POWERLEVEL9K_NVM_FOREGROUND                （node 版本）
#    colour37  → POWERLEVEL9K_ANACONDA_FOREGROUND           （conda 环境）
#    colour66  → POWERLEVEL9K_TIME_FOREGROUND               （时钟）
#    colour244 → POWERLEVEL9K_MULTILINE_*_PROMPT_PREFIX     （pane 边框）
#
#  注意：#() 中的脚本通过 $SHELL 执行，依赖 Nerd Font v3 字体来渲染 glyph。
# =============================================================================

# 状态栏刷新间隔（秒）：5s 与右侧动态信息（node / conda / 时间）相匹配
set -g status-interval 5

# 状态栏位置：底部
set -g status-position bottom

# 窗口标签居左对齐
set -g status-justify left

# 状态栏整体配色：底色 240 / 前景 250
set -g status-style "bg=colour240,fg=colour250"


# ── 窗口标签（Window Tabs）────────────────────────────────────────────────────

# 非当前窗口：中性灰
set -g window-status-style "fg=colour250,bg=colour240"

# 当前窗口：高亮蓝色 + 加粗
set -g window-status-current-style "fg=colour39,bg=colour240,bold"

# 普通窗口标签格式： 序号:窗口名
set -g window-status-format " #I:#W "

# 当前窗口标签格式：尾部加 * 标识
set -g window-status-current-format " #I:#W* "

# 窗口标签之间不加分隔符
set -g window-status-separator ""


# ── pane 边框 ────────────────────────────────────────────────────────────────

# 非活动 pane 的边框颜色
set -g pane-border-style        "fg=colour244"

# 活动 pane 的边框颜色（蓝色高亮，便于识别焦点）
set -g pane-active-border-style "fg=colour39"


# ── 命令提示 / 消息条 ────────────────────────────────────────────────────────

# prefix + : 进入命令模式时的输入条样式
set -g message-style "bg=colour240,fg=colour255,bold"


# ── 左侧状态：apple / 路径 / git 分支 / staged / unstaged / untracked ────────
#   提示：所有 #() 子命令均合并为单行，避免多行续写引起的解析问题。

set -g status-left-length 100
set -g status-left "#[fg=colour255,bold]#(printf '') #[fg=colour39,bold]#(echo '#{pane_current_path}' | sed \"s|$HOME|~|\") #[nobold,fg=colour76]#(cd '#{pane_current_path}' 2>/dev/null && b=$(git rev-parse --abbrev-ref HEAD 2>/dev/null) && [ -n \"$b\" ] && printf ' %s ' \"$b\")#[fg=colour178]#(cd '#{pane_current_path}' 2>/dev/null && git status --porcelain 2>/dev/null | awk 'BEGIN{a=0;u=0}/^[MADRCU]/{a++}/^ [MD]/{u++}END{if(a)printf \"+%d \",a;if(u)printf \"!%d \",u}')#[fg=colour39]#(cd '#{pane_current_path}' 2>/dev/null && t=$(git status --porcelain 2>/dev/null | grep -c '^??') && [ \"$t\" -gt 0 ] && printf '?%d ' \"$t\")"


# ── 右侧状态：node 版本 / conda 环境 / 当前时间 ──────────────────────────────
#   - node：仅当 `node` 可执行时显示
#   - conda：仅在非 base 环境时显示
#   - 时钟：%H:%M:%S，对应 POWERLEVEL9K_TIME_FORMAT

set -g status-right-length 80
set -g status-right "#[fg=colour70]#(v=$(node -v 2>/dev/null); [ -n \"$v\" ] && printf ' %s ' \"$v\")#[fg=colour37]#(e=$(printenv CONDA_DEFAULT_ENV); [ -n \"$e\" ] && [ \"$e\" != \"base\" ] && printf ' %s ' \"$e\")#[fg=colour66]#(printf '') %H:%M:%S "


# =============================================================================
#  插件（TPM —— Tmux Plugin Manager）
#  首次使用需先安装 TPM：
#    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#  然后在 tmux 中按  prefix + I  安装下方插件
# =============================================================================

# 插件管理器自身
set -g @plugin 'tmux-plugins/tpm'

# tmux-sensible：一组社区公认的合理默认值
set -g @plugin 'tmux-plugins/tmux-sensible'

# ⚠️ run 'tpm' 必须放在文件最末，所有插件声明之后
run '~/.tmux/plugins/tpm/tpm'
